[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fe-investing"
version = "0.1.0"
description = "Iron (Fe) Investing: statistical arbitrage following Feng & Palomar's signal processing approach to financial engineering."
authors = [{ name = "Brian Abod" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["matplotlib", "numpy", "pandas", "scipy"]

[project.scripts]
fe-download = "investing.price_download:main"

[project.urls]
Repository = "https://github.com/brianabod/fe_investing"

[tool.setuptools]
packages = ["investing"]
